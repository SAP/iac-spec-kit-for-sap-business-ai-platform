name: Deploy gh-page
on:
  workflow_dispatch:
  workflow_call:

# Zensical builds a static site into ./site and publishes it via the GitHub
# Pages artifact flow (no gh-pages branch). Requires Settings > Pages source
# to be set to "GitHub Actions".
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 20241106+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install mkdocs-material==9.5.33
      - run: mkdocs gh-deploy --force
